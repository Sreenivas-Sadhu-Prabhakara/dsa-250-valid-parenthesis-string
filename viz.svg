<text x="56.0" y="397.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">End with lo = 0 → some interpretation closes everything: valid. The interval</text>

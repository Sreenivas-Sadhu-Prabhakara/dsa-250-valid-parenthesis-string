<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">'*' can be '(', ')' or empty. Is "(*)" valid? Tracking every interpretation</text>
